[tools]
# runtime
python = ["3.12", "3.9", "3.10", "3.11", "3.13"]
node = "lts"
bun = "latest"

# compiler
go = "latest"
rust = "latest"
java = "corretto-8"

# python package managers
"pipx:poetry" = "2.5.1"
"aqua:astral-sh/uv" = "0.13.5"

# python dev tools
# ruff = "latest"

# node package managers
pnpm = "latest"

# node dev tools
# biome = "latest"

# task runner
task = "latest"

# cloud vendor clis
aws-cli = "latest"
gcloud = "latest"

# git hooks manager
"pipx:pre-commit" = "4.7.0"  # https://pre-commit.com/
"pipx:lefthook" = "2.2.2"  # https://github.com/evilmartians/lefthook?tab=readme-ov-file#why-lefthook

# not categorized
buf = "latest"
docker-cli = "28"  # 29 は podman で API version 1.41 is not supported by this client: the minimum supported API version is 1.44 となるので、一旦 28 固定
jq = "latest"
yq = "latest"
bat = "latest"
eza = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
jj = "latest"
gh = "latest"
shellcheck = "latest"
age = "latest"
aws-sso = "latest"
# bitwarden-secrets-manager = "latest"
amazon-ecr-credential-helper = "latest"
"npm:@anthropic-ai/claude-code" = "2.1.309"  # https://www.claude.com/product/claude-code
"npm:@typespec/compiler" = "1.17.0"  # https://typespec.io/docs/language-basics/visibility/
# "npm:@google/clasp" = "3.3.0" # https://github.com/google/clasp#readme
"npm:@hono/cli" = "0.1.11"  # https://speakerdeck.com/yusukebe/introduce-hono-cli
"npm:@github/copilot" = "1.0.103"
"npm:@bitwarden/cli" = "2026.2.0"  # https://bitwarden.com/help/article/cli/
"npm:@googleworkspace/cli" = "0.22.5"
"npm:portless" = "0.15.9"  # https://www.npmjs.com/package/portless
"pipx:awsume" = "4.5.4"  # https://awsu.me/
"pipx:typer" = "0.27.3"  # https://typer.tiangolo.com/tutorial/typer-command/#run-with-the-typer-command
"pipx:ansible-core" = "2.21.5"
"aqua:suzuki-shunsuke/pinact" = "5.0.1"  # https://github.com/suzuki-shunsuke/pinact

[tools."cargo:https://github.com/landlock-lsm/island"]  # https://github.com/landlock-lsm/island
version = "latest"
os = ["linux"]

[settings]
idiomatic_version_file_enable_tools = []
minimum_release_age = "7d"

# experimental = true
# lockfile = true

[settings.status]
missing_tools = 'always'
show_env = true

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "pnpm"

[env]
# CLAUDE_CODE_EFFORT_LEVEL = "high"
